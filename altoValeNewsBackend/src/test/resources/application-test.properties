# ----------------------------------------
# CONFIGURAÇÃO DO BANCO H2 PARA TESTES
# ----------------------------------------

# URL do banco de dados H2 em memória (volátil, descartado ao final)
spring.datasource.url=jdbc:h2:mem:testdb

# Driver do banco H2
spring.datasource.driver-class-name=org.h2.Driver

# Credenciais padrão (H2 não exige senha)
spring.datasource.username=sa
spring.datasource.password=

# Cria e destrói o schema a cada teste (ideal para garantir isolamento)
spring.jpa.hibernate.ddl-auto=create-drop

# Dialeto Hibernate compatível com H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Exibe SQL no console durante os testes
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG

# Permite sobrescrever beans no contexto de teste (caso existam duplicidades)
spring.main.allow-bean-definition-overriding=true

# Evita cache de contextos (opcional, útil em casos de conflitos com @DirtiesContext)
spring.test.context.cache.max-size=1

# Diretório para o upload de arquivos em ambiente de teste
file.upload-dir=target/test-uploads

